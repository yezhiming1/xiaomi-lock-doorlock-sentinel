<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>门锁观察簿 V0.1.1</title>
  <link rel="stylesheet" href="/app.css?v=0.1.1">
  <link rel="stylesheet" href="/apple-design.css?v=0.1.1">
  <script src="/time-format.js?v=0.1.1" defer></script>
  <script src="/ui-labels.js?v=0.1.1" defer></script>
  <script src="/app.js?v=0.1.1" defer></script>
</head>
<body>
  <section id="login" class="login" hidden>
    <div class="login-layout">
      <div class="login-intro">
        <a class="login-brand" href="#events" aria-label="门锁观察簿 V0.1.1">
          <span class="lock-mark" aria-hidden="true"></span>
          <span><strong>门锁观察簿</strong><small>V0.1.1 · 家庭记录</small></span>
        </a>
        <div class="login-story">
          <h1>欢迎回来</h1>
          <p>查看录像、核对人物样本，并了解系统如何得出每一次判断。</p>
        </div>
      </div>
      <div class="login-panel">
        <h2>进入家庭记录</h2>
        <p class="login-prompt">输入管理密码，继续核对门口记录。</p>
        <form id="login-form" class="login-form">
          <label for="password">管理密码</label>
          <input id="password" name="password" type="password" autocomplete="current-password" aria-describedby="login-error" required maxlength="256">
          <button class="button primary" type="submit">进入观察簿</button>
          <p id="login-error" class="form-error" role="alert" aria-live="polite"></p>
        </form>
        <p class="login-footnote">服务端仅保存可撤销会话；退出后需要重新输入密码。</p>
      </div>
      <p class="login-privacy">仅供家庭管理员使用 · 会话最长 12 小时<br>只整理，不开锁。识别结果永远不会触发开锁。</p>
    </div>
  </section>

  <div id="shell" class="app" hidden>
    <a class="skip-link" href="#main-content">跳到主要内容</a>
    <aside class="rail">
      <a class="brand" href="#events" aria-label="门锁观察簿 V0.1.1 首页">
        <span class="lock-mark small" aria-hidden="true"></span>
        <span><strong>门锁观察簿 <span class="app-version">V0.1.1</span></strong><small>门口事件记录</small></span>
      </a>
      <nav aria-label="主导航">
        <a href="#events" data-route="events" aria-label="事件" title="事件"><span class="nav-glyph" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 6h13M7 12h13M7 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg></span><span>事件</span></a>
        <a href="#people" data-route="people" aria-label="人物" title="人物"><span class="nav-glyph" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5.5 20c.5-4.3 2.7-6.5 6.5-6.5s6 2.2 6.5 6.5"/></svg></span><span>人物</span></a>
        <a href="#operations" data-route="operations" aria-label="运行" title="运行"><span class="nav-glyph" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 12h4l2-4 4 8 2-4h6"/></svg></span><span>运行</span></a>
        <a href="#settings" data-route="settings" aria-label="设置" title="设置"><span class="nav-glyph" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2"/><circle cx="15" cy="17" r="2"/></svg></span><span>设置</span></a>
      </nav>
      <div class="rail-status"><span class="rail-status-label">系统状态</span><strong id="rail-health">正在核对</strong><span id="rail-note">连接服务中</span></div>
    </aside>
    <main id="main-content" tabindex="-1">
      <header class="page-header">
        <div><h1 id="page-title" tabindex="-1">事件</h1><p id="page-subtitle" class="muted"></p></div>
        <button id="refresh" class="button quiet refresh-button" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.5 9a7 7 0 0 1 11.7-2L20 12M4 12l2.8 5A7 7 0 0 0 18.5 15"/></svg><span>刷新记录</span></button>
      </header>
      <div id="notice" class="notice" hidden role="status"></div>
      <div id="content" aria-live="polite" aria-busy="true"><div class="loading"><span></span>正在整理记录…</div></div>
    </main>
  </div>

  <dialog id="modal" class="modal" aria-labelledby="modal-title">
    <form id="modal-form" method="dialog">
      <div class="modal-head"><h2 id="modal-title"></h2><button class="icon-button" type="button" data-close-modal aria-label="关闭"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg></button></div>
      <div id="modal-body" class="modal-body"></div>
      <p id="modal-error" class="form-error" role="alert"></p>
      <div class="modal-actions"><button class="button quiet" type="button" data-close-modal>取消</button><button id="modal-submit" class="button primary" type="submit">确认</button></div>
    </form>
  </dialog>
  <dialog id="person-viewer" class="modal person-viewer" aria-labelledby="person-viewer-title" aria-describedby="person-viewer-note">
    <div class="modal-head"><h2 id="person-viewer-title">人物大图</h2><button type="button" class="icon-button" data-action="close-person-viewer" aria-label="关闭大图" autofocus><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg></button></div>
    <div class="viewer-controls" role="group" aria-label="选择查看图片">
      <button type="button" class="button quiet" data-action="person-viewer-face" aria-pressed="true">人脸大图</button>
      <button type="button" class="button quiet" data-action="person-viewer-scene" aria-pressed="false">场景原图</button>
    </div>
    <p id="person-viewer-note" class="muted">人脸原图分辨率有限，放大不会增加细节；可切换场景原图辅助确认。</p>
    <div id="person-viewer-media" class="viewer-media"></div>
    <div class="viewer-feedback"><p id="person-viewer-status" role="status" aria-live="polite"></p><button type="button" class="button quiet" data-action="retry-person-viewer" hidden>重新加载</button></div>
  </dialog>
  <div id="toast" class="toast" hidden role="status"></div>
</body>
</html>
