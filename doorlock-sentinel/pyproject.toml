[build-system]
requires = ["setuptools>=75,<81", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "doorlock-sentinel"
version = "0.0.6"
description = "NAS-native Xiaomi door-lock video recognition and review console"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26",
  "fastapi>=0.115,<1",
  "numpy>=1.26,<3",
  "onnxruntime>=1.20,<2",
  "opencv-python-headless>=4.10,<5",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0.36,<3",
  "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "httpx>=0.27,<1",
]

[project.scripts]
doorlockctl = "doorlock_sentinel.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
doorlock_sentinel = ["static/**/*"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "UP017", "UP042"]

[tool.coverage.run]
branch = true
source = ["doorlock_sentinel"]

[tool.coverage.report]
show_missing = true
skip_covered = true
