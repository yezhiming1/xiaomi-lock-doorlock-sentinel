[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/run/supervisord.pid
childlogdir=/tmp
user=root

[program:recognition]
command=/opt/venv/bin/uvicorn doorlock_sentinel.api:create_app --factory --host 0.0.0.0 --port 8787 --workers 1 --limit-concurrency 32 --no-access-log
user=doorlock
directory=/app
autostart=true
autorestart=true
startsecs=5
startretries=100
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=40
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1",PYTHONPATH="/app/src"
priority=10

[program:wecom-bot]
command=/usr/local/bin/node /app/services/wecom-bot/dist/index.js
user=doorlock
directory=/app/services/wecom-bot
autostart=true
autorestart=true
startsecs=5
startretries=100
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=40
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=20
